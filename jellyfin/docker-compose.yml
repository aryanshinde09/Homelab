services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 1000:1000
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /opt/docker/jellyfin/config:/config
      - /opt/docker/jellyfin/cache:/cache
      - type: bind
        source: /mnt/hdd/Anime
        target: /Anime
        #read_only: true
      - type: bind
        source: /mnt/hdd/Cartoons
        target: /Cartoons
        #read_only: true
      - type: bind
        source: /mnt/hdd/Movies
        target: /Movies
        #read_only: true
      - type: bind
        source: /mnt/hdd/tv_show
        target: /Tv_shows
        #read_only: true
    restart: 'unless-stopped'


  navidrome:
    dns:
        - 1.1.1.1
        - 8.8.8.8
    environment:
      ND_IMAGECACHESIZE: 1GB
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"          # <- your UID:GID from Part 2
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      - /opt/docker/navidrome/data:/data
      - /mnt/hdd/Music:/music:ro      # <- adjust to your real music folder